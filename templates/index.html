<!DOCTYPE html>
<html>
<head>
    <title>Solar Tracker Mission Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Courier New', monospace; background: #1a1a1a; color: #0f0; text-align: center; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        
        /* BOX STYLES */
        .box { background: #222; border: 2px solid #444; border-radius: 10px; padding: 20px; width: 300px; }
        h2 { border-bottom: 1px solid #444; padding-bottom: 10px; color: #fff; }
        
        /* STATUS */
        .status-dot { height: 15px; width: 15px; background: #555; border-radius: 50%; display: inline-block; }
        .active { background: #0f0; box-shadow: 0 0 10px #0f0; }
        .manual { background: #f00; box-shadow: 0 0 10px #f00; }

        /* SENSOR BARS */
        .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .bar-bg { background: #333; height: 80px; position: relative; border-radius: 4px; }
        .bar { position: absolute; bottom: 0; width: 100%; background: #fc0; transition: height 0.1s; }

        /* MANUAL CONTROLS */
        .dpad { display: grid; grid-template-columns: 60px 60px 60px; gap: 5px; justify-content: center; margin-top: 10px; opacity: 0.3; pointer-events: none; }
        button { background: #444; color: white; border: 1px solid #fff; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 20px; }
        button:active { background: #0f0; color: black; }
        
        .mode-btn { width: 48%; padding: 10px; font-weight: bold; }
        .btn-auto { background: #004400; }
        .btn-man { background: #440000; }
	
	.readme-box {
		text-align: left;
		max-width: 800px;
		margin: 40px auto;
		padding: 30px;
		background: #222;
		border-top: 2px solid #444;
		color: #ccc;
		font-family: sans-serif;
		line-height: 1.6;
	}
	.readme-box h1, .readme-box h2 { color: #fc0; border-bottom: 1px solid #444; padding-bottom: 5px;}
	.readme-box code { background: #444; padding: 2px 5px; border-radius: 3px; color: #fff; }
	.readme-box li { margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>SOLAR TRACKER V1</h1>

    <div class="container">
        
        <div class="box">
            <h2>SENSORS</h2>
            <div class="sensor-grid">
                <div>TL <div class="bar-bg"><div id="b-tl" class="bar" style="height:0%"></div></div><span id="v-tl">0.0</span></div>
                <div>TR <div class="bar-bg"><div id="b-tr" class="bar" style="height:0%"></div></div><span id="v-tr">0.0</span></div>
                <div>BL <div class="bar-bg"><div id="b-bl" class="bar" style="height:0%"></div></div><span id="v-bl">0.0</span></div>
                <div>BR <div class="bar-bg"><div id="b-br" class="bar" style="height:0%"></div></div><span id="v-br">0.0</span></div>
            </div>
        </div>

        <div class="box">
            <h2>CONTROLS</h2>
            <div>STATUS: <span id="status">INIT</span> <div id="dot" class="status-dot"></div></div>
            <br>
            <div>
                <button class="mode-btn btn-auto" onclick="setMode('AUTO')">AUTO</button>
                <button class="mode-btn btn-man" onclick="setMode('MANUAL')">MANUAL</button>
            </div>
            <div style="font-size: 1.2em; margin-bottom: 10px; color: #fc0;">
		PAN: <span id="pan-val">0</span>&deg;  |  TILT: <span id="tilt-val">-70</span>&deg;
	    </div>
            <div id="dpad" class="dpad">
                <div></div><button onclick="move('tilt','up')">⬆</button><div></div>
                <button onclick="move('pan','left')">⬅</button><div></div><button onclick="move('pan','right')">➡</button>
                <div></div><button onclick="move('tilt','down')">⬇</button><div></div>
            </div>
        </div>
    </div>
    <div class="readme-box">
        {{ readme | safe }}
    </div>
    <script>
        function update() {
            fetch('/data').then(r => r.json()).then(d => {
                // Update Bars
                document.getElementById('b-tl').style.height = (d.tl*100)+'%'; document.getElementById('v-tl').innerText = d.tl;
                document.getElementById('b-tr').style.height = (d.tr*100)+'%'; document.getElementById('v-tr').innerText = d.tr;
                document.getElementById('b-bl').style.height = (d.bl*100)+'%'; document.getElementById('v-bl').innerText = d.bl;
                document.getElementById('b-br').style.height = (d.br*100)+'%'; document.getElementById('v-br').innerText = d.br;

		document.getElementById('pan-val').innerText = d.pan_angle;
		document.getElementById('tilt-val').innerText = d.tilt_angle;

                // Update Status
                document.getElementById('status').innerText = d.mode;
                const dot = document.getElementById('dot');
                const dpad = document.getElementById('dpad');
                
                if(d.control_mode === "MANUAL") {
                    dot.className = "status-dot manual";
                    dpad.style.opacity = "1";
                    dpad.style.pointerEvents = "all";
                } else {
                    dot.className = "status-dot active";
                    dpad.style.opacity = "0.3";
                    dpad.style.pointerEvents = "none";
                }
            });
        }
        setInterval(update, 200);

        function setMode(m) { fetch('/set_mode/'+m); }
        function move(ax, dr) { fetch('/move/'+ax+'/'+dr); }
        function setThresh(v) { 
            document.getElementById('thresh-val').innerText = v;
            fetch('/set_thresh/'+v); 
        }
    </script>
</body>
</html>
